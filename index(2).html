<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>계산기</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background:#e8f4ff;font-family:Arial,"Malgun Gothic",sans-serif}
.calculator{width:min(94vw,440px);padding:24px;border-radius:24px;background:#202124;box-shadow:0 15px 40px rgba(0,0,0,.25)}
.display{width:100%;height:135px;margin-bottom:20px;padding:18px;border-radius:16px;background:#111214;color:white;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;overflow:hidden}
.previous{width:100%;min-height:25px;color:#9aa0a6;font-size:18px;text-align:right;overflow:hidden;white-space:nowrap}
.current{width:100%;color:white;font-size:clamp(42px,11vw,60px);font-weight:bold;text-align:right;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
button{height:82px;border:0;border-radius:18px;font-size:30px;font-weight:bold;cursor:pointer;transition:transform .08s,opacity .08s;user-select:none}
button:active{transform:scale(.94);opacity:.75}
.number{background:#3c4043;color:white}.function{background:#5f6368;color:white}.function:first-child{background:#e53935}.function:nth-child(2){background:#ff8c00}.operator{background:#ff9800;color:white}.equals{background:#34a853;color:white}.zero{grid-column:span 2}
@media(max-width:360px){button{height:72px;font-size:26px}.calculator{padding:16px}.display{height:120px}}
</style>
</head>
<body>
<div class="calculator">
<div class="display"><div class="previous" id="previous"></div><div class="current" id="current">0</div></div>
<div class="buttons">
<button class="function" onclick="clearAll()">AC</button>
<button class="function" onclick="deleteLast()">⌫</button>
<button class="function" onclick="percent()">%</button>
<button class="operator" onclick="chooseOperator('÷')">÷</button>
<button class="number" onclick="inputNumber('7')">7</button><button class="number" onclick="inputNumber('8')">8</button><button class="number" onclick="inputNumber('9')">9</button><button class="operator" onclick="chooseOperator('×')">×</button>
<button class="number" onclick="inputNumber('4')">4</button><button class="number" onclick="inputNumber('5')">5</button><button class="number" onclick="inputNumber('6')">6</button><button class="operator" onclick="chooseOperator('-')">−</button>
<button class="number" onclick="inputNumber('1')">1</button><button class="number" onclick="inputNumber('2')">2</button><button class="number" onclick="inputNumber('3')">3</button><button class="operator" onclick="chooseOperator('+')">+</button>
<button class="number zero" onclick="inputNumber('0')">0</button><button class="number" onclick="inputDecimal()">.</button><button class="equals" onclick="calculate()">=</button>
</div></div>
<script>
let currentValue="0",previousValue="",operator=null,resetScreen=false;
const currentDisplay=document.getElementById("current"),previousDisplay=document.getElementById("previous");
function updateDisplay(){currentDisplay.textContent=currentValue;previousDisplay.textContent=previousValue&&operator?previousValue+" "+operator:"";}
function inputNumber(n){if(currentValue==="오류")clearAll();if(resetScreen){currentValue=n;resetScreen=false}else currentValue=currentValue==="0"?n:currentValue+n;updateDisplay();}
function inputDecimal(){if(currentValue==="오류")clearAll();if(resetScreen){currentValue="0.";resetScreen=false}else if(!currentValue.includes("."))currentValue+=".";updateDisplay();}
function chooseOperator(op){if(currentValue==="오류"){clearAll();return}if(operator!==null&&!resetScreen)calculate();previousValue=currentValue;operator=op;resetScreen=true;updateDisplay();}
function calculate(){if(operator===null||resetScreen)return;const a=parseFloat(previousValue),b=parseFloat(currentValue);let r;if(operator==="+")r=a+b;else if(operator==="-")r=a-b;else if(operator==="×")r=a*b;else if(operator==="÷"){if(b===0){showError("0으로 나눌 수 없습니다.");return}r=a/b}if(!Number.isFinite(r)){showError("계산 오류");return}currentValue=String(Number(r.toPrecision(12)));previousValue="";operator=null;resetScreen=true;updateDisplay();}
function percent(){if(currentValue==="오류"){clearAll();return}currentValue=String(parseFloat(currentValue)/100);updateDisplay();}
function deleteLast(){if(currentValue==="오류"){clearAll();return}if(resetScreen)return;currentValue=currentValue.length<=1?"0":currentValue.slice(0,-1);if(currentValue==="-"||currentValue==="")currentValue="0";updateDisplay();}
function clearAll(){currentValue="0";previousValue="";operator=null;resetScreen=false;updateDisplay();}
function showError(m){currentValue="오류";previousValue=m;operator=null;resetScreen=true;updateDisplay();}
document.addEventListener("keydown",e=>{const k=e.key;if(k>="0"&&k<="9")inputNumber(k);else if(k===".")inputDecimal();else if(k==="+")chooseOperator("+");else if(k==="-")chooseOperator("-");else if(k==="*"||k.toLowerCase()==="x")chooseOperator("×");else if(k==="/"){e.preventDefault();chooseOperator("÷")}else if(k==="Enter"||k==="=")calculate();else if(k==="Backspace")deleteLast();else if(k==="Escape"||k==="Delete")clearAll();else if(k==="%")percent();});
updateDisplay();
</script>
</body>
</html>
